<!doctype html>
<html lang="zh-CN">
<head>

<title>枝头冬访 · 北长尾山雀</title>
<style>
  :root { color-scheme: dark; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body, #stage { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #152a2d; }
  #stage { position: fixed; inset: 0; background: radial-gradient(ellipse at 24% 18%, #778e84, #263e43 48%, #102327 88%); }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; }
  canvas[data-hover] { cursor: pointer; } canvas:active { cursor: grabbing; }
  canvas:focus-visible { outline: 1px solid #e1f3ed; outline-offset: -5px; }
  #hud { position: fixed; top: max(26px, env(safe-area-inset-top)); right: max(28px, env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; color: #f2f7f4; background: #182c2e93; border: 1px solid #d9f5ef27; border-radius: 13px; box-shadow: 0 8px 34px #0a171c26; backdrop-filter: blur(14px); font-size: 11px; letter-spacing: .1em; }
  #hints { display: flex; flex-direction: column; gap: inherit; pointer-events: none; }
  #quality { width: min(188px, calc(100vw - 64px)); border-top: 1px solid #d9f5ef27; padding-top: 9px; letter-spacing: .04em; }
  #quality summary { display: flex; align-items: center; justify-content: space-between; min-height: 25px; cursor: pointer; list-style: none; font-weight: 600; }
  #quality summary::-webkit-details-marker { display: none; }
  #quality summary::after { content: '+'; color: #b5d9cf; font-size: 16px; font-weight: 400; }
  #quality[open] summary::after { content: '−'; }
  .quality-controls { display: grid; gap: 9px; padding-top: 8px; }
  .quality-label, .quality-scale { display: flex; justify-content: space-between; gap: 8px; }
  .quality-label output { color: #c5e8dd; font-variant-numeric: tabular-nums; }
  .quality-scale { color: #bad1cb; font-size: 10px; }
  .quality-controls input { width: 100%; height: 24px; margin: 0; accent-color: #bdded3; cursor: pointer; }
  .quality-controls button { justify-self: end; padding: 5px 9px; background: #b5d9cf16; border: 1px solid #d9f5ef36; border-radius: 6px; color: inherit; font: inherit; cursor: pointer; }
  #quality :focus-visible { outline: 2px solid #d7f0e8; outline-offset: 3px; }
  @media (max-height: 380px) { #hud { max-height: calc(100dvh - 48px); overflow-y: auto; } }
  @media (pointer: coarse) { #quality summary, .quality-controls input, .quality-controls button { min-height: 34px; } }
  .hint { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .hint svg { width: 15px; height: 15px; fill: none; stroke: #b5d9cf; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
  .hint .touch { display: none; }
  #fallback { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; width: min(84%, 70ch); color: #eff7f4; text-align: center; font-size: 14px; line-height: 1.8; }
  #fallback[hidden] { display: none; }
  @media (pointer: coarse) { .hint .touch { display: inline; } .hint .mouse { display: none; } }
  @media (max-width: 600px) { #hud { top: max(15px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); gap: 9px; padding: 11px 12px; font-size: 10px; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<main id="stage" aria-label="冬日雪松枝头的北长尾山雀"></main>
<aside id="hud" aria-label="观鸟提示与设置">
<div id="hints" aria-label="互动提示">
  <span class="hint"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z"/><circle cx="10" cy="10" r="2"/></svg><span class="mouse">移动鼠标吸引视线</span><span class="touch">拖动环绕观察</span></span>
  <span class="hint"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17c4-5 7-7 12-10M6 14c-2-5 4-10 11-11 0 7-4 13-10 12m4-4.5.5-3.5"/></svg><span>点击山雀听鸟鸣</span></span>
  <span class="hint"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="4.8"/><path d="m12 12 4 4M6.5 8.5h4m-2-2v4"/></svg><span class="mouse">拖动环绕 · 滚轮缩放</span><span class="touch">双指捏合微距缩放</span></span>
</div>
<details id="quality" hidden>
  <summary>羽毛与鸟喙设置</summary>
  <div class="quality-controls">
    <div>
      <div class="quality-label"><label for="feather-count">羽毛几何数量</label><output id="count-value" for="feather-count">12,500</output></div>
      <input id="feather-count" type="range" min="3000" max="15000" step="500" value="12500">
    </div>
    <div>
      <div class="quality-label"><label for="feather-realism">羽毛真实度</label><output id="realism-value" for="feather-realism">80%</output></div>
      <input id="feather-realism" type="range" min="0" max="100" step="1" value="80" aria-describedby="realism-scale">
      <div class="quality-scale" id="realism-scale"><span>简洁羽面</span><span>细羽与绒边</span></div>
    </div>
    <div>
      <div class="quality-label"><label for="bill-opening">鸟喙开合</label><output id="bill-value" for="bill-opening">0%</output></div>
      <input id="bill-opening" type="range" min="0" max="100" step="1" value="0">
    </div>
    <button type="button" id="quality-reset">恢复默认</button>
  </div>
</details>
</aside>
<p id="fallback" role="status" hidden></p>
<noscript><p role="status">请开启 JavaScript，以进入雪松枝头的观鸟场景。</p></noscript>
<script type="module">
const stage = document.querySelector('#stage');
const fallback = document.querySelector('#fallback');
function fail(message) { fallback.textContent = message; fallback.hidden = false; }
try {
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  createWorld(THREE, OrbitControls);
} catch (error) {
  console.error(error);
  fail('无法开启观鸟场景。请检查是否能连接 CDN，以及浏览器是否支持 WebGL 2。');
}

function createWorld(T, OrbitControls) {
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('webgl2', { alpha:false, antialias:true, powerPreference:'high-performance' });
  if (!gl) throw new Error('WebGL 2 is not available');
  canvas.tabIndex = 0;
  canvas.setAttribute('aria-label', '互动北长尾山雀。按空格或回车可听鸟鸣。');
  stage.append(canvas);
  canvas.addEventListener('webglcontextlost', () => fail('图形上下文已中断，请重新载入页面。'));
  const renderer = new T.WebGLRenderer({canvas, context:gl});
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFShadowMap;
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(34, 1, .055, 95);
  const viewHome = new T.Vector3(-4.45, 2.34, 6.52);
  const targetHome = new T.Vector3(-.29, 1.02, -.34);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = .075;
  controls.enablePan = false; controls.rotateSpeed = .52; controls.zoomSpeed = .72;
  controls.maxPolarAngle = Math.PI * .58; controls.minPolarAngle = .36;
  controls.minDistance = 2.35; controls.maxDistance = 17;
  const V = (x=0,y=0,z=0) => new T.Vector3(x,y,z);
  const color = s => new T.Color(s);
  const PI = Math.PI, TAU = PI*2;
  const clamp = T.MathUtils.clamp, lerp = T.MathUtils.lerp;
  const smooth = (a,b,x) => T.MathUtils.smoothstep(x,a,b);
  let seed = 172412;
  function rng() { seed = (Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; }
  const between = (a,b) => lerp(a,b,rng());
  const sign = () => rng()<.5 ? -1 : 1;
  const up = V(0,1,0);
  const uTime = {value:0}, uBlinkProgress = {value:0};
  const uRealism = {value:.8}, uMotion = {value:1};
  const uRuffleOrigin = {value:V()}, uRuffleStart = {value:-10};
  const hasMSAA = gl.getContextAttributes()?.antialias === true;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const hemi = new T.HemisphereLight(0xe4f4ff, 0x77747f, 1.76);
  scene.add(hemi);
  function sunlight(hex,power,at) { const light=new T.DirectionalLight(hex,power); light.position.copy(at); scene.add(light); return light; }
  const key = sunlight(0xffe6c2, 2.05, V(-3,6,4));
  key.castShadow=true;
  key.target.position.set(-.4,.55,0); scene.add(key.target);
  Object.assign(key.shadow.camera,{left:-4.8,right:4.8,top:3.3,bottom:-3.3,near:.4,far:15});
  key.shadow.mapSize.set(1024,1024); key.shadow.bias=-.00018; key.shadow.normalBias=.025;
  sunlight(0xc0e3ff, .73, V(5,2,1));
  sunlight(0xffe0b3, 2.2, V(-3,4,-5));

  // Classic 3-D gradient Perlin noise: lattice gradients plus quintic interpolation.
  const perlin = /* glsl */`
    vec3 gradient3(vec3 p) {
      vec3 q = vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));
      return normalize(-1.0+2.0*fract(sin(q)*43758.5453)+vec3(.0001));
    }
    float perlin3(vec3 p) {
      vec3 i=floor(p), f=fract(p), u=f*f*f*(f*(6.0*f-15.0)+10.0);
      float a=dot(gradient3(i), f), b=dot(gradient3(i+vec3(1,0,0)), f-vec3(1,0,0));
      float c=dot(gradient3(i+vec3(0,1,0)), f-vec3(0,1,0)), d=dot(gradient3(i+vec3(1,1,0)), f-vec3(1,1,0));
      float e=dot(gradient3(i+vec3(0,0,1)), f-vec3(0,0,1)), g=dot(gradient3(i+vec3(1,0,1)), f-vec3(1,0,1));
      float h=dot(gradient3(i+vec3(0,1,1)), f-vec3(0,1,1)), k=dot(gradient3(i+vec3(1,1,1)), f-vec3(1,1,1));
      return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y),mix(mix(e,g,u.x),mix(h,k,u.x),u.y),u.z);
    }
  `;

  // Winter woods at optical infinity. The view direction makes the light shafts
  // and distant trunks move naturally when the camera orbits the perch.
  const sky = new T.Mesh(new T.SphereGeometry(58,36,24), new T.ShaderMaterial({
    side:T.BackSide, depthWrite:false,
    vertexShader:`varying vec3 vDirection; void main(){ vDirection=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:/* glsl */`
      varying vec3 vDirection;
      ${perlin}
      void main(){
        vec3 dir=normalize(vDirection);
        float angle=atan(dir.x,-dir.z);
        float h=dir.y;
        float horizon=smoothstep(-.48,.24,h);
        vec3 base=mix(vec3(.014,.036,.041),vec3(.062,.125,.137),horizon);
        float glow=exp(-3.4*pow(length((dir-normalize(vec3(-.60,.12,-.83)))*vec3(1.0,1.35,1.0)),2.));
        float air=perlin3(dir*5.0+4.0)*.65+perlin3(dir*11.0)*.35;
        base+=vec3(.15,.19,.16)*pow(glow,1.3);
        base+=vec3(.26,.20,.106)*pow(glow,4.9);
        base+=air*vec3(.050,.065,.063);
        float trunks=perlin3(vec3(cos(angle)*13.0,sin(angle)*13.0,h*1.1));
        float farTrunks=perlin3(vec3(cos(angle+.21)*27.0,sin(angle+.21)*27.0,h*1.6));
        float shade=smoothstep(.06,.49,trunks*.75+farTrunks*.25);
        base*=1.- .50*shade;
        gl_FragColor=vec4(max(base,0.),1.);
      }
    `
  }));
  sky.frustumCulled=false; sky.renderOrder=-100; scene.add(sky);

  const heightUniform={value:1};
  function particles(dust) {
    const positions=[], sizes=[], tones=[], phases=[];
    const count=dust?140:190;
    for(let i=0;i<count;i++) {
      let x,y,z,s;
      if(dust) { x=between(-8,8); y=between(-1,7); z=between(-12,4.2); s=between(.010,.038); }
      else {
        const angle=between(-PI,PI), r=between(11.5,30);
        x=Math.sin(angle)*r; z=Math.cos(angle)*r; y=between(-6,14);
        s=between(.17,1.1)*(i%11===0?1.8:1);
      }
      positions.push(x,y,z); sizes.push(s); tones.push(rng()); phases.push(between(0,TAU));
    }
    const geometry=new T.BufferGeometry();
    for(const [name,values,n] of [['position',positions,3],['aSize',sizes,1],['aTone',tones,1],['aPhase',phases,1]]) geometry.setAttribute(name,new T.Float32BufferAttribute(values,n));
    // Camera-facing instanced quads, not point sprites: bokeh can be larger than the GL point limit.
    const billboards=new T.InstancedBufferGeometry();
    const quad=new T.PlaneGeometry(1,1);
    billboards.index=quad.index;
    billboards.setAttribute('position',quad.attributes.position);
    billboards.setAttribute('uv',quad.attributes.uv);
    billboards.setAttribute('aCenter',new T.InstancedBufferAttribute(new Float32Array(positions),3));
    for(const name of ['aSize','aTone','aPhase']) billboards.setAttribute(name,new T.InstancedBufferAttribute(geometry.attributes[name].array,1));
    billboards.instanceCount=count;
    const material=new T.ShaderMaterial({
      defines:dust?{DUST:1}:{}, transparent:true, depthWrite:false,
      blending:dust?T.NormalBlending:T.AdditiveBlending,
      uniforms:{uTime},
      vertexShader:/* glsl */`
        uniform float uTime;
        attribute vec3 aCenter;
        attribute float aSize,aTone,aPhase;
        varying vec2 vDisk;
        varying float vTone,vPhase;
        void main(){
          vec3 p=aCenter;
          #ifdef DUST
          p.y=mod(p.y+1.0-uTime*(.095+.14*aTone),8.0)-1.0;
          p.x+=sin(uTime*.39+aPhase)*.35-uTime*.032;
          p.x=mod(p.x+8.0,16.0)-8.0;
          p.z+=.18*sin(uTime*.3+aPhase*2.0);
          #endif
          vec4 mv=modelViewMatrix*vec4(p,1.);
          mv.xy+=position.xy*aSize*2.;
          gl_Position=projectionMatrix*mv;
          vDisk=uv*2.-1.; vTone=aTone; vPhase=aPhase;
        }
      `,
      fragmentShader:/* glsl */`
        varying vec2 vDisk;
        varying float vTone,vPhase;
        void main(){
          float d=length(vDisk);
          #ifdef DUST
          float a=(1.-smoothstep(.09,1.,d))*(.24+.52*vTone);
          vec3 tint=mix(vec3(.53,.70,.78),vec3(1.,.89,.73),vTone);
          #else
          float angle=atan(vDisk.y,vDisk.x);
          d*=1.+.025*cos(angle*7.+vPhase);
          float a=(1.-smoothstep(.34,1.,d))*(.065+.23*pow(vTone,2.4));
          a+=exp(-pow((d-.71)*7.,2.))*.019*(1.-smoothstep(.78,1.,d));
          vec3 tint=mix(vec3(.17,.42,.46),vec3(.86,.67,.40),pow(vTone,2.8));
          #endif
          if(d>1.05) discard;
          gl_FragColor=vec4(tint,a);
        }
      `
    });
    const m=new T.Mesh(billboards,material); m.frustumCulled=false; m.renderOrder=dust?8:2; scene.add(m);
  }
  particles(false); particles(true);

  // Layered feather vanes use opaque depth writes and sample coverage at their fringes.
  function plumageMaterial(isHead, instanced) {
    const mat=new T.MeshStandardMaterial({color:0xffffff,roughness:.98,metalness:0,
      side:instanced?T.DoubleSide:T.FrontSide,alphaToCoverage:instanced&&hasMSAA});
    mat.customProgramCacheKey=()=>`plumage-${Number(isHead)}-${Number(instanced)}`;
    mat.onBeforeCompile=sh=>{
      Object.assign(sh.uniforms,{uTime,uMotion,uRealism,uRuffleOrigin,uRuffleStart});
      if(instanced) {
        sh.vertexShader=/* glsl */`
          uniform float uTime,uMotion,uRealism,uRuffleStart;
          uniform vec3 uRuffleOrigin;
          attribute vec2 aFeather;
          varying vec2 vVaneUV;
          varying vec3 vRootNormal;
          varying float vSeed,vLoose;
        `+sh.vertexShader;
        sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>',/* glsl */`
          #include <begin_vertex>
          vec3 root=instanceMatrix[3].xyz;
          vSeed=aFeather.x;
          vLoose=aFeather.y;
          vVaneUV=uv;
          vRootNormal=normalize(normalMatrix*instanceMatrix[2].xyz);
          float tip=uv.y;
          float flex=tip*tip;
          float pulse=.67*sin(uTime*2.1-root.x*5.2+root.y*3.3+vSeed*1.8)
                     +.25*sin(uTime*4.9+vSeed*6.28)+.08*sin(uTime*15.2+vSeed*20.);
          float age=uTime-uRuffleStart;
          float ruffle=0.0;
          if(age>=0.0 && age<1.5 && uMotion>0.0) {
            float delay=distance((modelMatrix*vec4(root,1.)).xyz,uRuffleOrigin)*.30;
            float localAge=age-delay;
            float t=max(localAge,0.0);
            ruffle=smoothstep(0.0,.045,localAge)*exp(-t*6.4)*sin(t*23.);
          }
          transformed.x+=flex*uMotion*(pulse*.035+ruffle*.12*vLoose);
          transformed.y+=flex*(uRealism-.5)*(.10+.18*vLoose);
          transformed.z+=flex*(uRealism*(.10+.32*vLoose+vSeed*.13)+uMotion*(pulse*.09+ruffle*(.68+.63*vLoose)));
          vCoat=root+(mat3(instanceMatrix)*position)*.57;
        `);
        sh.fragmentShader=/* glsl */`
          uniform float uRealism;
          varying vec2 vVaneUV;
          varying vec3 vRootNormal;
          varying float vSeed,vLoose;
        `+sh.fragmentShader;
      } else {
        sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n vCoat=position;');
      }
      sh.vertexShader='varying vec3 vCoat;\n'+sh.vertexShader;
      sh.fragmentShader=`varying vec3 vCoat;\n${perlin}\n`+sh.fragmentShader;
      sh.fragmentShader=sh.fragmentShader.replace('#include <color_fragment>',/* glsl */`
        #include <color_fragment>
        float n=perlin3(vCoat*5.2)*.76+perlin3(vCoat*13.0)*.24;
        vec3 cream=vec3(.86,.785,.685), white=vec3(.97,.958,.929);
        vec3 feather=mix(cream,white,clamp(.70+n*.65,0.,1.));
        ${isHead ? `
          float nx=vCoat.x/.60, ny=vCoat.y/.535, nz=abs(vCoat.z)/.52;
          float napeContour=length(vec2((nx+.59)/.58,(ny-(.01-.16*nx+n*.17))/.34));
          float nape=(1.-smoothstep(.43,1.10,napeContour))*smoothstep(.35,.72,nz);
          feather=mix(feather,vec3(.17,.138,.127),nape*.83);
        ` : `
          float mantle=smoothstep(.03,.54,vCoat.y+n*.18)*(1.-smoothstep(-.51,.33,vCoat.x));
          float flank=smoothstep(.08,.52,abs(vCoat.z))*(1.-smoothstep(-.46,.24,vCoat.y))*(1.-smoothstep(-.66,.35,vCoat.x));
          feather=mix(feather,vec3(.25,.213,.196)*(1.+n*.22),mantle*.84);
          feather=mix(feather,vec3(.76,.445,.405)*(1.+n*.18),flank*.87);
        `}
        ${instanced ? `
          float side=vVaneUV.x*2.0-1.0;
          float tip=vVaneUV.y;
          float fringe=uRealism*(.38+.62*vLoose);
          float edge=max(abs(side),smoothstep(.65,1.0,tip));
          float phase=tip*(13.0+vSeed*7.0)-abs(side)*(2.3+tip)+vSeed*4.5;
          float detail=1.-smoothstep(.23,.72,fwidth(phase));
          float strand=.5+.5*cos(6.283185*phase+.45*sin(phase*1.3));
          float comb=mix(.52,strand,detail);
          float cut=1.035-fringe*(.030+.23*comb)*smoothstep(.41,.96,edge);
          float op=1.-smoothstep(cut-.06,cut+.045,edge);
          float separated=smoothstep(.48,1.0,edge)*smoothstep(.48,.94,comb)*fringe;
          float featherCoverage=op*(1.-.51*separated);
          ${hasMSAA ? 'if(featherCoverage<.015) discard;' : 'if(featherCoverage<.45) discard;'}
          float rootTone=mix(.954,1.003,smoothstep(.12,.88,tip));
          feather*=rootTone*(.989+.023*vSeed)*(1.+detail*fringe*(strand-.5)*.055);
        ` : 'feather*=.965;'}
        diffuseColor.rgb*=feather;
      `);
      if(instanced) {
        sh.fragmentShader=sh.fragmentShader.replace('#include <normal_fragment_begin>',/* glsl */`
          #include <normal_fragment_begin>
          // Blending toward the coat normal keeps tangent vanes from lighting like beads.
          vec3 coatNormal=normalize(vRootNormal);
          if(dot(coatNormal,normal)<0.0) normal=-normal;
          normal=normalize(mix(coatNormal,normal,mix(.10,.31,uRealism)*(.76+.24*vLoose)));
        `).replace('#include <opaque_fragment>',/* glsl */`
          vec3 towardEye=normalize(vViewPosition);
          vec3 winterLight=normalize(mat3(viewMatrix)*vec3(-.55,.48,-.66));
          float rim=pow(1.-abs(dot(coatNormal,towardEye)),3.0);
          float backlight=smoothstep(.15,.91,dot(towardEye,-winterLight));
          outgoingLight+=diffuseColor.rgb*vec3(1.,.88,.73)*rim*backlight*(.11+.35*edge)*(.22+.78*uRealism);
          #include <opaque_fragment>
          ${hasMSAA?'gl_FragColor.a=featherCoverage;':''}
        `);
      }
    };
    return mat;
  }
  function gridMesh(rows,cols,fn,flip=false) {
    const pos=[], uv=[], idx=[];
    for(let i=0;i<=rows;i++) for(let j=0;j<=cols;j++) {
      const p=fn(i/rows,j/cols);
      pos.push(p.x,p.y,p.z); uv.push(j/cols,i/rows);
      if(i<rows&&j<cols) {
        const a=i*(cols+1)+j,b=a+cols+1;
        if(flip) idx.push(a,a+1,b,b,a+1,b+1); else idx.push(a,b,a+1,b,b+1,a+1);
      }
    }

  }
  function interact(e) {
    const rect=canvas.getBoundingClientRect();
    ndc.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
    raycaster.setFromCamera(ndc,camera);
    const intersections=raycaster.intersectObjects(hitParts,false);
    if(intersections.length){
      sing();
      startRuffle(intersections[0].point);
      if(rng()<.26)setBlink(tick,.33);
    }
  }
  let pressPoint=null;
  canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;lastClick=performance.now();pressPoint={x:e.clientX,y:e.clientY,id:e.pointerId};});
  canvas.addEventListener('pointerup',e=>{if(!pressPoint||pressPoint.id!==e.pointerId)return;const moved=Math.hypot(e.clientX-pressPoint.x,e.clientY-pressPoint.y);pressPoint=null;if(moved<8)interact(e);});
  canvas.addEventListener('pointercancel',()=>{pressPoint=null;});
  function startRuffle(point) {
    if(reducedMotion.matches) return;
    uRuffleOrigin.value.copy(point);
    uRuffleStart.value=tick;
  }
  const keyboardRufflePoint=V();
  canvas.addEventListener('keydown',e=>{
    if(e.code!=='Space'&&e.code!=='Enter') return;
    e.preventDefault();
    if(e.repeat) return;
    sing();
    torso.getWorldPosition(keyboardRufflePoint);
    startRuffle(keyboardRufflePoint);
  });

  const clock=new T.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const raw=clock.getDelta(), dt=Math.min(raw,.055);
    if(raw>.12) skyKick=Math.max(skyKick,raw);
    tick+=dt; uTime.value=tick;
    if(!reducedMotion.matches) {
      const breath=Math.sin(tick*1.33)*.0078+Math.sin(tick*2.67+.4)*.0029+Math.sin(tick*.57)*.0036;
      torso.scale.set(1+breath*.44,1+breath*.93,1+breath*.50);
      torso.position.y=1.11+breath*.33;
      torso.rotation.z=.009*Math.sin(tick*.71)+.004*Math.sin(tick*1.9);
      bird.position.copy(birdRestPosition).addScaledVector(stanceForward,.004*Math.sin(tick*1.2+.7));
      bird.position.y+=.009*Math.sin(tick*1.05)+.0035*Math.sin(tick*2.21+.4);
      updateLegs();
      wings.forEach((w,i)=>{w.rotation.y=(i?1:-1)*(.009*Math.sin(tick*1.5+i)+.002*Math.sin(tick*5));});
      tail.rotation.x=.012*Math.sin(tick*.73+.7); tail.rotation.z=.008*Math.sin(tick*.91);
    }
    updateBill(dt);
    uMotion.value=reducedMotion.matches?0:1;
    if(tick>=nextTilt) {
      tiltFrom=tiltValue; tiltTo=between(-.11,.11); tiltStart=tick; tiltDuration=between(.62,.91); nextTilt=tick+between(2.1,3.9);
      if(rng()<.40)blinkStart=tick+between(.13,.43);
    }
    const u=clamp((tick-tiltStart)/tiltDuration,0,1);
    const ease=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    tiltValue=lerp(tiltFrom,tiltTo,ease);
    if(tick>=tiltStart+tiltDuration && Math.abs(tiltTo)<.043 && tick>nextTilt-.12){tiltFrom=tiltTo;tiltTo=sign()*between(.056,.095);}
    let yawTrack=0, pitchTrack=0;
    if(pointerInside&&ndc.lengthSq()<1.1) {
      cameraRight.setFromMatrixColumn(camera.matrixWorld,0);
      yawTrack=-ndc.x*.13*cameraRight.dot(stanceSide);
      pitchTrack=ndc.y*.049;
    }
    headEuler.set(reducedMotion.matches?0:tiltValue,yawTrack,pitchTrack);
    head.quaternion.slerp(headTarget.setFromEuler(headEuler),1-Math.exp(-dt*5.8));
    updateEyeGaze();
    // Separate the next deadline from the active sweep so every blink visibly closes.
    if(tick>=nextBlinkAt) {
      blinkStart=tick; blinkKind=0; blinkDelay=between(2.7,4.4); nextBlinkAt=tick+blinkDelay;
    }
    const blinkT=tick-blinkStart;
    uBlinkProgress.value=blinkEnvelope(blinkT);
    dustMotes.forEach(({mote,phase,speed,origin})=>{
      if(!reducedMotion.matches) {mote.position.y=origin.y+Math.sin(tick*speed+phase)*.045;mote.position.x=origin.x+Math.sin(tick*speed*.58+phase)*.033;}
    });
    controls.update();
    if(++fpsStep%4===0) updateLens();
    renderer.render(scene,camera);
  }
  frame();
}
</script>
